[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hesuvi-auto-editor"
version = "0.1.0"
description = "Source-aware Dirac capture extraction for HeSuVi"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "matplotlib>=3.8,<4"]

[project.scripts]
hesuvi-auto-editor = "dirac_to_hesuvi:main"

[tool.setuptools]
py-modules = ["dirac_to_hesuvi"]
